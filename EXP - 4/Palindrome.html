<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Checker</title>
</head>

<body>

    <h2>Palindrome Checker</h2>

    <p>Name: Arya Khandekar</p>
    <p>PRN: 24070521219</p>

    <input type="text" id="text" placeholder="Enter a word">

    <button onclick="checkPalindrome()">Check</button>

    <p id="answer"></p>


<script>

    // Function to check palindrome
    function checkPalindrome() {

        try {

            let word = document.getElementById("text").value;

            if (word == "") {
                throw "Please enter a word";
            }


            let reverse = "";

            // Loop to reverse the word
            for (let i = word.length - 1; i >= 0; i--) {
                reverse = reverse + word[i];
            }


            // Checking palindrome
            if (word == reverse) {
                document.getElementById("answer").innerHTML =
                word + " is a Palindrome";
            }
            else {
                document.getElementById("answer").innerHTML =
                word + " is not a Palindrome";
            }

        }

        catch(error) {

            document.getElementById("answer").innerHTML =
            error;

        }

    }


    // Closure Example
    function countFunction() {

        let count = 0;

        return function() {
            count++;
            console.log(count);
        };

    }


    let counter = countFunction();


    // Arrow Function
    let message = () => {
        console.log("JavaScript Lab Experiment");
    };

    message();

</script>

</body>
</html>
