<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Academic Entry Portal</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#fff;
}

.container{
    width:320px;
    margin:20px auto;
}

h2{
    text-align:center;
    font-size:18px;
    margin-bottom:10px;
}

h3{
    font-size:13px;
    border-bottom:1px solid #000;
    padding-bottom:5px;
}

label{
    font-size:12px;
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:15px;
    padding:8px;
    background:#111;
    color:white;
    border:none;
    cursor:pointer;
}

#result{
    margin-top:15px;
    border:1px solid #999;
    padding:10px;
    font-size:12px;
    white-space:pre-line;
}
</style>

</head>

<body>

<div class="container">

<h2>24070521219</h2>

<h3>ACADEMIC ENTRY PORTAL</h3>

<label>Student Name</label>
<input type="text" id="name">

<label>PRN Number</label>
<input type="text" id="prn">

<label>Subject 1 Marks (0-100)</label>
<input type="number" id="m1">

<label>Subject 2 Marks (0-100)</label>
<input type="number" id="m2">

<label>Subject 3 Marks (0-100)</label>
<input type="number" id="m3">

<label>Subject 4 Marks (0-100)</label>
<input type="number" id="m4">

<label>Subject 5 Marks (0-100)</label>
<input type="number" id="m5">

<button onclick="calculate()">PROCESS RESULT</button>

<h3>SYSTEM OUTPUT RECEIPT</h3>

<div id="result"></div>

</div>

<script>

function calculate(){

let name=document.getElementById("name").value.trim();
let prn=document.getElementById("prn").value.trim();

let marks=[
Number(document.getElementById("m1").value),
Number(document.getElementById("m2").value),
Number(document.getElementById("m3").value),
Number(document.getElementById("m4").value),
Number(document.getElementById("m5").value)
];

if(name==""){
alert("Please enter student name");
return;
}

if(prn==""){
alert("Please enter PRN Number");
return;
}

for(let i=0;i<marks.length;i++){

if(isNaN(marks[i]) || marks[i]<0 || marks[i]>100){
alert("Marks should be between 0 and 100");
return;
}

}

let total=0;

for(let i=0;i<marks.length;i++){
total+=marks[i];
}

let percentage=(total/500)*100;

let grade="";

if(percentage>=90)
grade="A+";
else if(percentage>=80)
grade="A";
else if(percentage>=70)
grade="B";
else if(percentage>=60)
grade="C";
else if(percentage>=50)
grade="D";
else
grade="F";

document.getElementById("result").innerHTML=
"<b>STUDENT ACADEMIC REPORT</b><br><br>"+
"Student Name : "+name+"<br>"+
"PRN Number : "+prn+"<br><br>"+
"Subject 1 : "+marks[0]+"<br>"+
"Subject 2 : "+marks[1]+"<br>"+
"Subject 3 : "+marks[2]+"<br>"+
"Subject 4 : "+marks[3]+"<br>"+
"Subject 5 : "+marks[4]+"<br><br>"+
"Total Marks : "+total+"/500<br>"+
"Percentage : "+percentage.toFixed(2)+"%<br>"+
"Grade : "+grade;

}

</script>

</body>
</html>
